# Reverse proxy for locus.pawanpatra.com
# Backend (FastAPI/uvicorn) on 127.0.0.1:8000, frontend (Next.js) on 127.0.0.1:3000.
# Install: sudo cp deploy/nginx/locus.pawanpatra.com.conf /etc/nginx/sites-available/locus.pawanpatra.com
#          sudo ln -s /etc/nginx/sites-available/locus.pawanpatra.com /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run: sudo certbot --nginx -d locus.pawanpatra.com   (adds the HTTPS server block automatically)

server {
    listen 80;
    listen [::]:80;
    server_name locus.pawanpatra.com;

    client_max_body_size 10m;

    # Backend API — api_prefix is already /api/v1, so keep the path unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
