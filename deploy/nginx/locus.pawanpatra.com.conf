# Reverse proxy for locus.pawanpatra.com
# Backend (FastAPI/uvicorn) on 127.0.0.1:8000, frontend (Next.js) on 127.0.0.1:3000.
# Install: sudo cp deploy/nginx/locus.pawanpatra.com.conf /etc/nginx/sites-available/locus.pawanpatra.com
#          sudo ln -s /etc/nginx/sites-available/locus.pawanpatra.com /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run: sudo certbot --nginx -d locus.pawanpatra.com   (adds the HTTPS server block automatically)

server {
    listen 80;
    listen [::]:80;
    server_name locus.pawanpatra.com;

    client_max_body_size 10m;

    # The agent's reply streams over SSE, which needs the opposite of what nginx does by
    # default. Buffering would hold the tokens back and deliver them in a lump, which is
    # exactly the behaviour streaming exists to avoid, and the default 60s read timeout
    # would cut the connection part way through a turn that is still working.
    # A regex location takes precedence over the /api/ prefix below, so this wins for the
    # stream and nothing else changes.
    location ~ ^/api/v1/agent/turns/[^/]+/stream$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        # Longer than the agent's own turn timeout, so the turn is always what ends the
        # stream rather than the proxy.
        proxy_read_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API — api_prefix is already /api/v1, so keep the path unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
